name: Google Flow Cloud Automation

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      prompt:
        description: 'Prompt or instruction for Google Flow'
        required: false
        default: 'Generate test video clip'
  schedule:
    - cron: '0 12 * * *'

concurrency:
  group: flow-cloud-run
  cancel-in-progress: true

jobs:
  run-flow:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install --with-deps chromium
          sudo apt-get install -y xvfb

      - name: Run Google Flow Automation via browser-use
        env:
          PYTHONUNBUFFERED: '1'
          GOOGLE_STORAGE_STATE: ${{ secrets.GOOGLE_STORAGE_STATE }}
        run: |
          xvfb-run -a python run_cloud_flow.py 2>&1 | tee runner.log
      - name: Output Summary to GitHub
        if: always()
        run: |
          echo '### Runner Log' >> 
          echo '\' >> 
          cat runner.log >> 
          echo '\' >> 
